<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sur</title>
<meta name="description" content="Your own ad-free music player.">
<meta name="theme-color" content="#121019" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F7F4EF" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sur">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500;600;700&family=Rozha+One&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20.5 10.7 19.3C5.9 15 3 12.3 3 8.9A4.8 4.8 0 0 1 7.9 4c1.6 0 3.1.8 4.1 2 1-1.2 2.5-2 4.1-2A4.8 4.8 0 0 1 21 8.9c0 3.4-2.9 6.1-7.7 10.4L12 20.5Zm-4.1-14.5A2.8 2.8 0 0 0 5 8.9c0 2.5 2.4 4.8 7 8.9 4.6-4.1 7-6.4 7-8.9A2.8 2.8 0 0 0 16.1 6c-1.2 0-2.3.7-2.8 1.8h-2.6A3.1 3.1 0 0 0 7.9 6Z"/></symbol>

  <symbol id="i-upload" viewBox="0 0 24 24"><path d="M11 16V7.8L7.4 11.4 6 10l6-6 6 6-1.4 1.4L13 7.8V16h-2Zm-7 2h16v2H4v-2Z"/></symbol>

<div class="shell">
  <div class="app">
    <aside class="side" aria-label="Sidebar">
      <div class="brand"><span class="logo" lang="hi">सुर</span><span class="word">Sur</span></div>
      <nav class="nav" id="nav">
        <button data-act="go" data-view="home"><svg class="i"><use href="#i-home"/></svg><span>Home</span></button>
        <button data-act="go" data-view="search"><svg class="i"><use href="#i-search"/></svg><span>Search</span></button>
        <button data-act="go" data-view="library"><svg class="i"><use href="#i-library"/></svg><span>Your library</span></button>
        <button data-act="go" data-view="discover"><svg class="i"><use href="#i-compass"/></svg><span>Discover</span></button>
      </nav>
      <div class="side-sec">
        <div class="side-h"><span>Playlists</span><button class="icon-btn" data-act="new-playlist" aria-label="New playlist"><svg class="i"><use href="#i-plus"/></svg></button></div>
        <ul class="pl-list" id="plList"></ul>
      </div>
    </aside>

    <main class="main" id="main" tabindex="-1"></main>

    <aside class="queue" id="queue" hidden aria-label="Queue">
      <div class="queue-h"><span class="h2">Queue</span><button class="icon-btn" data-act="toggle-queue" aria-label="Close queue"><svg class="i"><use href="#i-close"/></svg></button></div>
      <div class="queue-body" id="queueBody"></div>
    </aside>
  </div>

  <footer class="player" id="player" aria-label="Player">
    <div class="p-now" data-act="open-sheet">
      <div id="pArt"></div>
      <div class="p-txt"><span class="row-t" id="pTitle">Nothing playing</span><span class="row-a" id="pArtist">Pick a song to start</span></div>
      <button class="icon-btn like" id="pLike" data-act="like-current" aria-label="Like"><svg class="i"><use href="#i-heart"/></svg></button>
    </div>
    <div class="p-center">
      <div class="p-ctrls">
        <button class="icon-btn" id="pShuffle" data-act="shuffle" aria-label="Shuffle"><svg class="i"><use href="#i-shuffle"/></svg></button>
        <button class="icon-btn" data-act="prev" aria-label="Previous"><svg class="i"><use href="#i-prev"/></svg></button>
        <button class="p-play" id="pPlay" data-act="toggle" aria-label="Play"><svg class="i"><use href="#i-play"/></svg></button>
        <button class="icon-btn" data-act="next" aria-label="Next"><svg class="i"><use href="#i-next"/></svg></button>
        <button class="icon-btn" id="pRepeat" data-act="repeat" aria-label="Repeat"><svg class="i"><use href="#i-repeat"/></svg></button>
      </div>
      <div class="p-seek"><span id="pCur">0:00</span><input type="range" class="rng" id="pSeek" min="0" max="1000" value="0" aria-label="Seek"><span id="pDur">0:00</span></div>
    </div>
    <div class="p-right">
      <button class="icon-btn" id="pQueueBtn" data-act="toggle-queue" aria-label="Queue"><svg class="i"><use href="#i-queue"/></svg></button>
      <button class="icon-btn" id="pMute" data-act="mute" aria-label="Mute"><svg class="i"><use href="#i-volume"/></svg></button>
      <input type="range" class="rng vol" id="pVol" min="0" max="100" value="80" aria-label="Volume">
    </div>
    <button class="p-play p-mini-play" id="pMiniPlay" data-act="toggle" aria-label="Play"><svg class="i"><use href="#i-play"/></svg></button>
    <div class="p-mini-bar"><i id="pMiniBar"></i></div>
  </footer>

  <nav class="tabbar" id="tabbar" aria-label="Main">
    <button data-act="go" data-view="home"><svg class="i"><use href="#i-home"/></svg>Home</button>
    <button data-act="go" data-view="search"><svg class="i"><use href="#i-search"/></svg>Search</button>
    <button data-act="go" data-view="library"><svg class="i"><use href="#i-library"/></svg>Library</button>
    <button data-act="go" data-view="discover"><svg class="i"><use href="#i-compass"/></svg>Discover</button>
  </nav>
</div>

<section class="sheet" id="sheet" hidden aria-label="Now playing">
  <div class="sheet-top">
    <button class="icon-btn" data-act="close-sheet" aria-label="Close"><svg class="i"><use href="#i-down"/></svg></button>
    <span class="eyebrow">Now playing</span>
    <button class="icon-btn" data-act="toggle-queue" aria-label="Queue"><svg class="i"><use href="#i-queue"/></svg></button>
  </div>
  <div id="sArt"></div>
  <div class="sheet-info">
    <div class="p-txt"><span class="row-t" id="sTitle"></span><span class="row-a" id="sArtist"></span></div>
    <button class="icon-btn like" id="sLike" data-act="like-current" aria-label="Like"><svg class="i"><use href="#i-heart"/></svg></button>
  </div>
  <div class="p-seek"><span id="sCur">0:00</span><input type="range" class="rng" id="sSeek" min="0" max="1000" value="0" aria-label="Seek"><span id="sDur">0:00</span></div>
  <div class="p-ctrls">
    <button class="icon-btn" id="sShuffle" data-act="shuffle" aria-label="Shuffle"><svg class="i"><use href="#i-shuffle"/></svg></button>
    <button class="icon-btn" data-act="prev" aria-label="Previous"><svg class="i"><use href="#i-prev"/></svg></button>
    <button class="p-play" id="sPlay" data-act="toggle" aria-label="Play"><svg class="i"><use href="#i-play"/></svg></button>
    <button class="icon-btn" data-act="next" aria-label="Next"><svg class="i"><use href="#i-next"/></svg></button>
    <button class="icon-btn" id="sRepeat" data-act="repeat" aria-label="Repeat"><svg class="i"><use href="#i-repeat"/></svg></button>
  </div>
</section>

<div id="menuHost"></div>
<div id="modalHost"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="drop" id="drop" hidden><div>Drop songs to add them to your library</div></div>
<input type="file" id="fileIn" accept="audio/*,.mp3,.m4a,.aac,.flac,.ogg,.opus,.wav" multiple hidden>
<audio id="audio" preload="metadata"></audio>

<script src="app.js"></script>
</body>
</html>
